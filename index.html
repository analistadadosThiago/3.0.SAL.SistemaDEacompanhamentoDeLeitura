<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAL – Sistema de Análise de Leitura</title>
    <meta name="description" content="Plataforma avançada de BI para monitoramento de leituristas e impedimentos de medição de energia elétrica.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #090d16;
        color: #f8fafc;
        margin: 0;
        min-height: 100vh;
      }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .animate-fade-in {
        animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
</head>
<body class="min-h-screen bg-[#090D16] text-slate-100 selection:bg-blue-600/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
